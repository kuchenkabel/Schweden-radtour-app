name: Datenpaket Schweden

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monatlich am 1. um 03:00 UTC
  push:
    branches: [main]
    paths:
      - scripts/build_pois.py
      - .github/workflows/data.yml

permissions:
  contents: write

jobs:
  pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: OSM-Extrakt Schweden laden
        run: curl -sSfL -o sweden.osm.pbf https://download.geofabrik.de/europe/sweden-latest.osm.pbf
      - name: POIs filtern
        run: |
          osmium tags-filter sweden.osm.pbf \
            nwa/amenity=shelter,drinking_water,water_point,toilets,pharmacy,clinic,hospital \
            nwa/tourism=camp_site,hostel,wilderness_hut,alpine_hut \
            nwa/leisure=bathing_place,swimming_area,playground \
            nwa/healthcare=centre,hospital \
            nwa/shop=supermarket,convenience,bicycle,outdoor,sports,hardware,doityourself \
            nw/railway=station,halt \
            -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq -o filtered.geojsonseq
      - name: Kompakte POI-Datei bauen
        run: |
          python3 scripts/build_pois.py filtered.geojsonseq pois-sweden.json
          gzip -9 -k pois-sweden.json
          ls -lh pois-sweden.json*
      - name: Als Release "data-latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Datenpaket (automatisch)" --notes "POIs Schweden aus OpenStreetMap. Wird monatlich neu gebaut." --prerelease
          gh release upload data-latest pois-sweden.json.gz --clobber
